# thanks claude

name: Build VoodooPS2Controller

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Install the old MacOSX10.8 SDK
        run: |
          mkdir -p logs Build/Products
          DEV="$(xcode-select -p)"
          SDKDIR="$DEV/Platforms/MacOSX.platform/Developer/SDKs"
          # The exact release tag for this file is unverified, so try a few known tags.
          for tag in 10.13 MacOSX10.11.sdk 11.3; do
            url="https://github.com/phracker/MacOSX-SDKs/releases/download/$tag/MacOSX10.8.sdk.tar.xz"
            echo "Trying $url" | tee -a logs/sdk.log
            if curl -fL -o /tmp/MacOSX10.8.sdk.tar.xz "$url" 2>>logs/sdk.log; then
              echo "Downloaded from tag $tag" | tee -a logs/sdk.log
              break
            fi
          done
          test -s /tmp/MacOSX10.8.sdk.tar.xz
          sudo tar -xf /tmp/MacOSX10.8.sdk.tar.xz -C "$SDKDIR"
          # Modern Xcode refuses SDKs older than this value; lower it so 10.8 is allowed.
          sudo plutil -replace MinimumSDKVersion -string 10.8 "$DEV/Platforms/MacOSX.platform/Info.plist"
          ls "$SDKDIR" | tee -a logs/sdk.log
          { sw_vers; xcodebuild -version; xcodebuild -showsdks; } 2>&1 | tee logs/env.log

      - name: Build (attempt 1, "All Kext" scheme, 10.8 SDK)
        id: attempt1
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project VoodooPS2Controller.xcodeproj -scheme "All Kext" \
            -configuration Release \
            SYMROOT="$PWD/Build/Products" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee logs/attempt1.log

      - name: Build (attempt 2, all targets, 10.8 SDK)
        if: steps.attempt1.outcome == 'failure'
        id: attempt2
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project VoodooPS2Controller.xcodeproj -alltargets \
            -configuration Release \
            SYMROOT="$PWD/Build/Products" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee logs/attempt2.log

      - name: Build (attempt 3, modern SDK + MacKernelSDK, 10.6 target)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        id: attempt3
        continue-on-error: true
        run: |
          set -o pipefail
          SDK="$PWD/MacKernelSDK"
          xcodebuild -project VoodooPS2Controller.xcodeproj -scheme "All Kext" \
            -configuration Release \
            SYMROOT="$PWD/Build/Products" \
            SDKROOT=macosx \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.6 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$SDK/Headers" \
            SYSTEM_HEADER_SEARCH_PATHS="$SDK/Headers" \
            LIBRARY_SEARCH_PATHS="$SDK/Library/x86_64" \
            2>&1 | tee logs/attempt3.log

      - name: Inspect result
        if: always()
        run: |
          echo "== kexts found ==" | tee logs/result.log
          find Build -name "*.kext" -maxdepth 6 2>&1 | tee -a logs/result.log
          echo "== binaries ==" | tee -a logs/result.log
          find Build -path "*Contents/MacOS/*" -type f 2>/dev/null | while read -r f; do
            echo "$f"; file "$f"
          done 2>&1 | tee -a logs/result.log

      - name: Package
        if: always()
        run: |
          if [ -d Build/Products/Release ]; then
            ditto -c -k --sequesterRsrc --keepParent Build/Products/Release VoodooPS2-built.zip
          else
            echo "No Release folder was produced; see logs." > NO-BUILD.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voodoops2-result
          path: |
            VoodooPS2-built.zip
            NO-BUILD.txt
            logs/
          if-no-files-found: warn

      # red if no kext came out
      - name: Fail if no kext was built
        if: always()
        run: |
          test -n "$(find Build -name '*.kext' -maxdepth 6 | head -1)"
